# The corpus scorecard: every corpus reference refilled and checked by KiCad, every
# board.py built, routed and checked the same way, then scored. Needs KiCad, so it
# runs on demand and weekly, not on every push (see the Check workflow for pkidl's own
# gate). The scorecard is uploaded as an artifact.

name: Corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # The same pinned KiCad as the Check workflow's KiCad job.
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user root
    env:
      KICAD_CLI: kicad-cli
      # The autorouter's jar, as the Check workflow pins it: a bump changes both.
      FREEROUTING_SHA256: f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # The router, for the boards built from a board.py.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Freerouting (pinned version, checked jar)
        run: |
          ver=$(sed -n 's/^WANT_FREEROUTING = "\(.*\)"$/\1/p' spike/src/kidl_spike/doctor.py)
          test -n "$ver" || { echo "WANT_FREEROUTING not found in doctor.py"; exit 1; }
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/freerouting.jar" \
            "https://github.com/freerouting/freerouting/releases/download/v$ver/freerouting-$ver.jar"
          echo "$FREEROUTING_SHA256  $RUNNER_TEMP/freerouting.jar" | sha256sum -c -
          # Headless, and without the analytics it otherwise posts on every start.
          echo "FREEROUTING=java -Djava.awt.headless=true -jar $RUNNER_TEMP/freerouting.jar" \
            "--gui.enabled=false --usage_and_diagnostic_data.disable_analytics=true" >> "$GITHUB_ENV"

      - name: Setup
        run: just setup

      - name: Scorecard
        run: just corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: |
            build/corpus/scorecard.json
            build/corpus/*/drc.json
            build/corpus/*/built.json
            build/corpus/*/built-drc.json
            build/corpus/*/built.kicad_pcb
