[project]
name = "pkidl"
version = "0.1.0"
description = "Design PCBs in Python: a DSL for a board's layout and intent, and a generator that writes KiCad files"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkidl"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# spike/ is a separate project, checked by its own tooling; docs/ examples are prose.
extend-exclude = ["spike", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
