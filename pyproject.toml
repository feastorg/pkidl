[project]
name = "kidl-spike"
version = "0.1.0"
description = "Generate BREAD KiCad boards from Python (skidl + pkidl)"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "skidl>=2.2.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidl_spike"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1",
]

# SKiDL is pinned to a local checkout: upstream has no KiCad 10 backend, and we
# expect to carry patches (see _planning). Swap for a released version once the
# boundary is proven.
[tool.uv.sources]
skidl = { path = "../skidl", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# SKiDL ships no type stubs and uses dynamic attribute injection heavily.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
