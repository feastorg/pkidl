[project]
name = "pkidl"
version = "0.1.0"
description = "Design PCBs in Python: a DSL for a board's layout and intent, and a generator that writes KiCad files"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cameron Brooks" }]
keywords = ["pcb", "kicad", "eda", "layout", "skidl", "hardware"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "shapely>=2.2.0",
]

[project.urls]
Repository = "https://github.com/feastorg/pkidl"
Issues = "https://github.com/feastorg/pkidl/issues"
Changelog = "https://github.com/feastorg/pkidl/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkidl"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# spike/ is a separate project, checked by its own tooling; docs/ examples are prose.
# ruff formats *.md, and an agent session's sandbox masks .claude/loop.md with a
# placeholder that cannot be read, which fails the check with exit code 2.
extend-exclude = ["spike", "docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
